[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/checkout/success"
  to = "/checkout/success.html"
  status = 200

[[redirects]]
  from = "/checkout/cancel"
  to = "/checkout/cancel.html"
  status = 200

# Block common scanner targets before any SPA rewrites. These rules are forced so
# a mistakenly uploaded file at one of these paths is not exposed.
[[redirects]]
  from = "/wp/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/wordpress/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/wp-admin/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/backup/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/old/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/new/*"
  to = "/404.html"
  status = 404
  force = true

# Only the application's known client-side routes receive the SPA shell.
[[redirects]]
  from = "/login"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/products/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/categories/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/manufacturers/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/shop"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/shop/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/custom-workwear"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/custom-workwear/*"
  to = "/index.html"
  status = 200

# Keep the extensionless success route used by the existing forms.
[[redirects]]
  from = "/thank-you"
  to = "/thank-you.html"
  status = 200

# Supplier product imagery proxy.
#
# The Petra bucket is named "petraimages.com", and a bucket name containing dots
# cannot be served over valid TLS: the virtual-hosted host
# petraimages.com.s3.amazonaws.com does not match AWS's *.s3.amazonaws.com
# wildcard certificate, and S3 rejects path-style addressing for this bucket with
# a PermanentRedirect. The images are therefore reachable over http only, and an
# http <img> on an https page is blocked as mixed content.
#
# Proxying through the site fixes that: Netlify fetches the http origin
# server-side and serves the bytes over the site's own certificate. It also gives
# every image a first-party https URL, which is what Google Merchant Center and
# Googlebot need to fetch.
#
# The rule is deliberately narrow — one hard-coded bucket and prefix — so it
# cannot be used as an open proxy for arbitrary hosts.
[[redirects]]
  from = "/shop-images/*"
  to = "http://petraimages.com.s3.amazonaws.com/600x600/:splat"
  status = 200
  force = true

# Existing files (including robots.txt, sitemap.xml, and assets) are served before
# this non-forced fallback. Everything else, including arbitrary .php paths, is 404.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
