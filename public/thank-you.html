<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Request Sent | Telecom Store</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #14201d;
        background: #f4f6f4;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(560px, 100%);
        padding: 28px;
        background: #ffffff;
        border: 1px solid #e3e8e4;
        border-radius: 8px;
        box-shadow: 0 16px 36px rgba(20, 32, 29, 0.12);
      }

      h1 {
        margin: 0 0 10px;
        font-size: 30px;
        line-height: 1.1;
      }

      p {
        margin: 0 0 18px;
        color: #5b6472;
        line-height: 1.55;
      }

      a {
        display: inline-flex;
        align-items: center;
        min-height: 42px;
        padding: 0 16px;
        color: #ffffff;
        background: #c8182e;
        border-radius: 7px;
        font-weight: 800;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Request sent.</h1>
      <p>Thanks. Telecom Store will review your message and reply with the next step.</p>
      <a href="/">Back to Telecom Store</a>
    </main>
  </body>
</html>
