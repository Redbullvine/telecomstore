<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Payment not completed — Telecom Store</title>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f6f8fa; color: #14202b; display: grid; min-height: 100vh; place-items: center; }
    .card { background: #fff; border: 1px solid #dfe6ec; border-radius: 12px; padding: 40px 36px; max-width: 460px; margin: 24px; text-align: center; box-shadow: 0 6px 24px rgba(20, 32, 43, .06); }
    .mark { width: 56px; height: 56px; border-radius: 50%; background: #fdf1e7; color: #b54708; display: grid; place-items: center; font-size: 26px; margin: 0 auto 18px; }
    h1 { font-size: 22px; margin: 0 0 10px; }
    p { line-height: 1.55; color: #46586a; margin: 0 0 14px; }
    a.button { display: inline-block; margin-top: 8px; padding: 11px 22px; border-radius: 8px; background: #14202b; color: #fff; text-decoration: none; font-weight: 600; }
    a.button:hover { background: #23374a; }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">!</div>
    <h1>Payment not completed</h1>
    <p>No charge was made. Your payment link or invoice is still valid — you can reopen it any time to finish paying.</p>
    <p>Questions about your quote? Reply to our email or reach out and we will help.</p>
    <a class="button" href="/">Back to Telecom Store</a>
  </main>
</body>
</html>
