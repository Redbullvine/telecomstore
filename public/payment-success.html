<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Payment received — Telecom Store</title>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f6f8fa; color: #14202b; display: grid; min-height: 100vh; place-items: center; }
    .card { background: #fff; border: 1px solid #dfe6ec; border-radius: 12px; padding: 40px 36px; max-width: 460px; margin: 24px; text-align: center; box-shadow: 0 6px 24px rgba(20, 32, 43, .06); }
    .mark { width: 56px; height: 56px; border-radius: 50%; background: #e7f6ee; color: #157347; display: grid; place-items: center; font-size: 28px; margin: 0 auto 18px; }
    h1 { font-size: 22px; margin: 0 0 10px; }
    p { line-height: 1.55; color: #46586a; margin: 0 0 14px; }
    a.button { display: inline-block; margin-top: 8px; padding: 11px 22px; border-radius: 8px; background: #14202b; color: #fff; text-decoration: none; font-weight: 600; }
    a.button:hover { background: #23374a; }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" id="mark">✓</div>
    <h1 id="headline">Confirming your payment…</h1>
    <p id="detail">One moment while we verify your payment with Stripe.</p>
    <p id="reference" hidden></p>
    <p>A receipt from Stripe is on its way to your email. We will confirm your order and follow up with shipping details.</p>
    <a class="button" href="/">Back to Telecom Store</a>
  </main>
  <script>
    // Confirmation is retrieved SERVER-SIDE via the session id; nothing in
    // the query string is trusted for amounts or status.
    (async function () {
      const headline = document.getElementById("headline");
      const detail = document.getElementById("detail");
      const reference = document.getElementById("reference");
      const sessionId = new URLSearchParams(window.location.search).get("session_id");
      if (!sessionId) {
        headline.textContent = "Payment received — thank you.";
        detail.textContent = "Your payment to Telecom Store was completed successfully.";
        return;
      }
      try {
        const response = await fetch("/api/checkout-status?session_id=" + encodeURIComponent(sessionId));
        const result = await response.json();
        if (response.ok && result.ok && result.paid) {
          headline.textContent = "Payment received — thank you.";
          detail.textContent = "Your payment to Telecom Store was verified successfully.";
        } else if (response.ok && result.ok && result.processing) {
          headline.textContent = "Payment processing";
          detail.textContent = "Your payment method is processing. We will email you as soon as it completes.";
        } else {
          headline.textContent = "Payment not confirmed yet";
          detail.textContent = "We could not verify this payment yet. If you completed checkout, you will receive a Stripe receipt by email.";
          document.getElementById("mark").textContent = "…";
        }
        if (result && result.reference_code) {
          reference.hidden = false;
          reference.innerHTML = "Your order reference: <strong>" + String(result.reference_code).replace(/[^A-Z0-9-]/g, "") + "</strong>";
        }
      } catch (error) {
        headline.textContent = "Payment received";
        detail.textContent = "We could not reach the confirmation service, but your Stripe receipt email is authoritative.";
      }
    })();
  </script>
</body>
</html>
